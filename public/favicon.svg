<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .space-ring {
      stroke: var(--accent, #b89c72);
      stroke-width: 2.5;
      transition: all 0.3s ease;
    }
    .pixel-core {
      fill: var(--accent, #b89c72);
      transition: all 0.3s ease;
    }
    :root {
      --accent: #b89c72;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --accent: #826a45;
      }
    }
  </style>
  <!-- Beautiful abstract symbol for: "Moving pixels. Holding space." -->
  <!-- Holding Space: outer delicate ring -->
  <circle cx="16" cy="16" r="10" class="space-ring" fill="none" />
  <!-- Moving Pixels: precise inner solid core, offset representing motion -->
  <circle cx="13" cy="16" r="4" class="pixel-core" />
</svg>
